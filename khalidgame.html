<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجلسة - تحدي المعلومات العامة</title>
    <!-- استيراد خط عربي جميل من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
            font-weight: 900;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        /* شاشة البداية */
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background: #1d4ed8;
        }
        /* شاشة اللعبة */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
        }
        .badge {
            background: #f59e0b;
            color: #000;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .timer {
            font-size: 20px;
            font-weight: bold;
            color: #ef4444;
        }
        .question-box {
            background: #334155;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .question-text {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .answer-reveal {
            font-size: 16px;
            color: #34d399;
            margin-top: 10px;
            display: none;
        }
        .teams-scores {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
        }
        .team-score {
            text-align: center;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn-success { background: #16a34a; }
        .btn-success:hover { background: #15803d; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-secondary { background: #475569; }
        .btn-secondary:hover { background: #334155; }
    </style>
</head>
<body>

<div class="container">
    <h1>جلسة وفلة 🎮</h1>

    <!-- 1. شاشة إدخال الفرق -->
    <div id="setup-screen" class="screen active">
        <div class="form-group">
            <label for="team1-name">اسم الفريق الأول:</label>
            <input type="text" id="team1-name" value="فريق الصقور">
        </div>
        <div class="form-group">
            <label for="team2-name">اسم الفريق الثاني:</label>
            <input type="text" id="team2-name" value="فريق النمور">
        </div>
        <button onclick="startGame()">ابدأ التحدي 🚀</button>
    </div>

    <!-- 2. شاشة الأسئلة واللعب -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <span class="badge" id="category-badge">الفئة</span>
            <span class="timer">⏳ <span id="time-left">15</span> ثانية</span>
        </div>

        <div class="teams-scores">
            <div class="team-score">
                <div id="t1-label">فريق 1</div>
                <strong id="t1-score" style="font-size: 22px; color: #38bdf8;">0</strong>
            </div>
            <div style="border-left: 1px solid #475569;"></div>
            <div class="team-score">
                <div id="t2-label">فريق 2</div>
                <strong id="t2-score" style="font-size: 22px; color: #38bdf8;">0</strong>
            </div>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">جاري تحميل السؤال...</div>
            <div class="answer-reveal" id="answer-reveal">الإجابة: <span id="answer-text"></span></div>
        </div>

        <div id="controls-phase-1" class="actions">
            <button class="btn-secondary" onclick="revealAnswer()">إظهار الإجابة 👁️</button>
        </div>

        <div id="controls-phase-2" class="actions" style="display: none; margin-top: 10px;">
            <button class="btn-success" onclick="awardPoints(1)">إجابة صحيحة لـ <span id="btn-t1">فريق 1</span> (+10)</button>
            <button class="btn-success" onclick="awardPoints(2)">إجابة صحيحة لـ <span id="btn-t2">فريق 2</span> (+10)</button>
            <button class="btn-danger" onclick="nextQuestion()">خطأ / تخطي ⏭️</button>
        </div>
    </div>

    <!-- 3. شاشة النهاية -->
    <div id="end-screen" class="screen" style="text-align: center;">
        <h2>انتهى التحدي! 🏆</h2>
        <p id="winner-text" style="font-size: 20px; margin: 20px 0; color: #38bdf8;"></p>
        <button onclick="location.reload()">العب مرة أخرى 🔄</button>
    </div>
</div>

<script>
    const questions = [
        { category: "على الطاير", question: "اذكر 3 مدن سعودية تبدأ بحرف الميم.", answer: "مكة، المدينة، المجمعة", time: 10 },
        { category: "أيام الطيبين", question: "ايش اسم كرتون الطفولة اللي كان بطله يحاول يرجع لأمه وفيه شخصية 'عبسي'؟", answer: "عدنان ولينا", time: 15 },
        { category: "صكها بالمقلوب", question: "شي كل ما أخذت منه كبر، وكل ما حطيت فيه صغر.. ايش هو؟", answer: "الحفرة", time: 20 },
        { category: "على الطاير", question: "اذكر 3 أكلات شعبية تعتمد على التمر أو الدخن.", answer: "الحنيني، المصابيب، الكليجا", time: 10 },
        { category: "مين يقصد؟", question: "مين أكثر شخص بالجلسة هذي ممكن ينسى وين حاط جواله وهو ماسكه بيده؟", answer: "تصويت الجماعة", time: 15 }
    ];

    let currentQIndex = 0;
    let scores = [0, 0];
    let teamNames = ["فريق 1", "فريق 2"];
    let timer;
    let timeLeft = 15;

    function startGame() {
        teamNames[0] = document.getElementById("team1-name").value || "فريق 1";
        teamNames[1] = document.getElementById("team2-name").value || "فريق 2";

        document.getElementById("t1-label").innerText = teamNames[0];
        document.getElementById("t2-label").innerText = teamNames[1];
        document.getElementById("btn-t1").innerText = teamNames[0];
        document.getElementById("btn-t2").innerText = teamNames[1];

        document.getElementById("setup-screen").classList.remove("active");
        document.getElementById("game-screen").classList.add("active");

        loadQuestion();
    }

    function loadQuestion() {
        if (currentQIndex >= questions.length) {
            endGame();
            return;
        }

        const q = questions[currentQIndex];
        document.getElementById("category-badge").innerText = q.category;
        document.getElementById("question-text").innerText = q.question;
        document.getElementById("answer-text").innerText = q.answer;
        document.getElementById("answer-reveal").style.display = "none";
        
        document.getElementById("controls-phase-1").style.display = "block";
        document.getElementById("controls-phase-2").style.display = "none";

        timeLeft = q.time;
        document.getElementById("time-left").innerText = timeLeft;

        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById("time-left").innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                revealAnswer();
            }
        }, 1000);
    }

    function revealAnswer() {
        clearInterval(timer);
        document.getElementById("answer-reveal").style.display = "block";
        document.getElementById("controls-phase-1").style.display = "none";
        document.getElementById("controls-phase-2").style.display = "flex";
    }

    function awardPoints(teamNumber) {
        scores[teamNumber - 1] += 10;
        document.getElementById("t1-score").innerText = scores[0];
        document.getElementById("t2-score").innerText = scores[1];
        nextQuestion();
    }

    function nextQuestion() {
        currentQIndex++;
        loadQuestion();
    }

    function endGame() {
        document.getElementById("game-screen").classList.remove("active");
        document.getElementById("end-screen").classList.add("active");

        let winnerMessage = "";
        if (scores[0] > scores[1]) {
            winnerMessage = `مبروك الفوز لـ **${teamNames[0]}** بـ ${scores[0]} نقطة! 🎉`;
        } else if (scores[1] > scores[0]) {
            winnerMessage = `مبروك الفوز لـ **${teamNames[1]}** بـ ${scores[1]} نقطة! 🎉`;
        } else {
            winnerMessage = `تعادل الفريقين بنتيجة ${scores[0]} نقطة! 🤝`;
        }
        document.getElementById("winner-text").innerHTML = winnerMessage;
    }
</script>

</body>
</html>
